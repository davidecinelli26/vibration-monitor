# Tutto per lo sviluppo in locale: password semplici, porte aperte solo su questo PC.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: vibrazioni
      POSTGRES_PASSWORD: vibrazioni
      POSTGRES_DB: vibrazioni
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro   # eseguito solo al primo avvio
      - dati_db:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # niente login in locale
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - db

volumes:
  dati_db:
