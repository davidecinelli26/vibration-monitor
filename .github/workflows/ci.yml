name: ci

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e esp32

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        progetto: [ingestor, replay, agente]
    services:
      # serve ai test dell'agente; gli altri lo ignorano
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: vibrazioni
          POSTGRES_PASSWORD: vibrazioni
          POSTGRES_DB: vibrazioni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibrazioni"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.progetto }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q
